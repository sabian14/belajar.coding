<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="name">Name:</label><br><br>
        <input type="text" id="name" name="name"><br><br>

        <label for="password">Password:</label><br><br>
        <input type="password" id="password" name="password"><br><br>

        <label for="email">Email:</label><br><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="gender">Jenis Kelamin:</label><br>
        <input type="radio" id="gender" name="gender" value="male">
        <label for="gender">Laki-Laki</label><br>

        <input type="radio" id="gender" name="gender" value="female">
        <label for="gender">Perempuan</label><br><br>

        <label for="hobi">Hobi:</label><br>
        <input type="checkbox" id="hobi" name="hobi" value="yes">
        <label for="hobi">Voli</label><br>

        <input type="checkbox" id="hobi" name="hobi" value="no">
        <label for="hobi">Basket</label><br>

        <input type="checkbox" id="hobi" name="hobi" value="yes">
        <label for="hobi">Sepak Bola</label><br>

        <input type="checkbox" id="hobi" name="hobi" value="no">
        <label for="hobi">Renang</label><br><br>

        <label for="jurusan">Jurusan:</label>
        <select id="jurusan" name="jurusan">
            <option value="rpl">RPL</option>
            <option value="mp ">MP</option>
            <option value="bd">BD</option>
            <option value="lp">LP</option>
        </select><br><br>

        <label for="alamat">Alamat:</label><br>
        <textarea id="alamat" name="alamat" rows="4" cols="50" placeholder="Tulis alamat Anda di sini"></textarea><br>

        <button type="submit" value="Submit">Submit</button>
        <button type="reset" value="Reset">Reset</button>
    </form>
</body>
</html>
