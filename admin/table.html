<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Table</title>
</head>

<body>
    <h2>Tabel Simple</h2>
    <table border="1" cellpadding="10">
        <tr>
            <td>a</td>
            <td>b</td>
        </tr>
        <tr>
            <td>c</td>
            <td>d</td>
        </tr>
    </table>

    <h2>Tabel Complex</h2>
    <table border="1" cellspacing="0" cellpadding="10">
        <thead>
            <tr>
                <th>No.</th>
                <th>Nama</th>
                <th>Kelas</th>
                <th>Jurusan</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>1</th>
                <td>Sabian Jordan Savindri</td>
                <td>XI RPL 1</td>
                <td>RPL (Rekayasa Perangkat Lunak)</td>
            </tr>
            <tr>
                <th>2</th>
                <td>Dafa Cesar Febrianto</td>
                <td>XI RPL 1</td>
                <td>RPL (Rekayasa Perangkat Lunak)</td>
            </tr>
        </tbody>
    </table>

    <h2>Colspan & Rowspan</h2>
    <table border="1" cellspacing="0" cellpadding="5">
        <tr>
            <td colspan="2">1,1</td>
            <td rowspan="3">1,3</td>
        </tr>
        <tr>
            <td>2,1</td>
            <td>2,2</td>
        </tr>
        <tr>
            <td>3,1</td>
            <td>3,2</td>
        </tr>
    </table>
</body>

</html>
